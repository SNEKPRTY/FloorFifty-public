# The tutorial's song, supplied by the project owner as FloorFifty Tutorial.mp3.
#
# Every number was measured from the delivery encode, by the method in
# docs/art/exceptional-race-slice-review.md ("Measurement method"). The encode
# decodes to the source's 7 198 080 frames at zero sample offset (0.998
# correlation), so these describe the file that ships.
#
# The tempo was an octave call. A beat-grid scan at 0.01 BPM scores 188.16 at
# 2.37x the onset envelope's mean, against 1.19 at 187.16 and 1.10 at 189.16;
# the half tempo, 94.08, scores 2.05, and the kick falls harder on alternate
# beats. The project owner chose 188.16 on 2026-09-25.
#
# `beatOffsetTicks` is 8 because the first beat sits at 132.7 ms and a tick is
# 16.667 ms; the 0.6 ms residual is visual only.
#
# Not in `catalog.toml`: `tutorial.toml` names it, and no room races it.
# The tutorial loops the whole file (0 to its 149 960 ms length).
id = "dawn-tutorial"
displayName = "FloorFifty Tutorial"
bpm = 188.16
beatOffsetTicks = 8
loopStartMs = 0
loopEndMs = 149960
audioAlias = "music.tutorial"
