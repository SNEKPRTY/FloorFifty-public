# The story, in its smallest valid shape: one actor, one cutscene, one chapter with a climb and a dive.
[prompts.move]
keyboard = "A D to steer"
gamepad = "{glyph} to steer"
touch = "Drag to steer"
buttons = "Hold an arrow to steer"

[prompts.fastFall]
keyboard = "S to drop fast"
gamepad = "{glyph} to drop fast"
touch = "Flick down to drop fast"
buttons = "Hold the down arrow to drop fast"

[actors.pal]
characterId = "ninja"
colour = "cyan"
personality = { reactionTicks = 9, linedUpFraction = 0.7, slipChance = 0.1, slipTicks = 14, movingFloorPause = 20, stallTicks = 900, eagerDrop = 0.03, leadEase = 1, easeTicks = 70 }

[[cutscenes]]
id = "first"
title = "First"
bed = "ambience.dawn"

[[cutscenes.panels]]
art = "story.lowtown"
move = { kind = "push", from = 1.0, to = 1.08 }
lines = [{ text = "Up we go." }, { speaker = "pal", mood = "win", text = "Follow me!" }]

[ending]
cutscene = "first"
thesis = ["Look down."]
last = { speaker = "you", text = "That was fun." }

[[chapters]]
id = "only"
title = "The Only One"
stageId = "dawn"
songId = "dawn-tutorial"
seed = 35
floorOffset = 0
parSeconds = 60
before = "first"
startFloor = 0
teaches = ["move", "fastFall"]
lamps = [3]

[[chapters.actors]]
id = "pal"
ceiling = 6
leash = true

[[chapters.glims]]
floor = 2
offset = -90

[[chapters.phases]]
id = "climb"
goal = { kind = "reach", floor = 6, lamps = 1 }

[[chapters.phases]]
id = "dive"
goal = { kind = "rescue", actor = "pal" }
lava = { under = "actor", startBelow = 420, rise = 8.0, grace = 0 }
safeSpots = [6]

[[chapters.moments]]
when = { kind = "start" }
lines = [{ speaker = "pal", text = "Up!" }]

[[chapters.moments]]
when = { kind = "phase", phase = "dive" }
do = [{ do = "place", actor = "pal", floor = 2, parked = true }]
lines = [{ speaker = "pal", mood = "lose", text = "Help!" }]

[[chapters.moments]]
when = { kind = "rescue" }
do = [{ do = "unpark", actor = "pal" }]
