# The interactive tutorial (launch polish spec §3.1.4).
#
# A base-tuning course from `seed`, ended early at `targetFloor`. Each step
# completes on what the simulation did (packages/shared/src/level/tutorial.ts);
# the prompt is the player's own input method's wording. `seed` is chosen by
# the probe in tests/shared/level/tutorial.test.ts: a moving floor must sit
# low enough to reach before the survive step.
seed = 4
targetFloor = 8
# The tutorial's own stage, outside the race catalog (content/stages/dawn.toml).
stageId = "dawn"
# The tutorial's own song, outside the race catalog (content/songs/dawn-tutorial.toml).
songId = "dawn-tutorial"

[[steps]]
kind = "move"
prompt.keyboard = "Steer left, then right, with A and D."
prompt.gamepad = "Steer left, then right."
prompt.touch = "Drag left, then right, to steer."

[[steps]]
kind = "land"
prompt.keyboard = "You bounce on your own. Steer onto the next floor up."
prompt.gamepad = "You bounce on your own. Steer onto the next floor up."
prompt.touch = "You bounce on your own. Steer onto the next floor up."

[[steps]]
kind = "fastFall"
prompt.keyboard = "Hold S in the air to drop fast."
prompt.gamepad = "Press A, or push down, in the air to drop fast."
prompt.touch = "Flick down in the air to drop fast."

[[steps]]
kind = "landMoving"
prompt.keyboard = "Land on a moving floor. Time your steer."
prompt.gamepad = "Land on a moving floor. Time your steer."
prompt.touch = "Land on a moving floor. Time your drag."

[[steps]]
kind = "survive"
prompt.keyboard = "Stay above the lava."
prompt.gamepad = "Stay above the lava."
prompt.touch = "Stay above the lava."
