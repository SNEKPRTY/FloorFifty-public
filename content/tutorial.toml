# The interactive tutorial (launch polish spec §3.1.4).
#
# A base-tuning course from `seed`. Each step
# completes on what the simulation did (packages/shared/src/level/tutorial.ts);
# the prompt is the player's own input method's wording: `touch` for swipe
# steering, `buttons` (where it differs) for the on-screen buttons, and a
# gamepad prompt may name `{glyph}`, where the pad's own button is drawn. `seed` is chosen by
# the probe in tests/shared/level/tutorial.test.ts: a moving floor must sit
# low enough to reach before the survive step. The last step has a slow edge of
# its own (tuning.toml, TUTORIAL_EDGE_RISE) and is done three floors above where
# it began. `targetFloor` is read by nothing now that the fill-the-counter step
# is gone; it stays until the schema drops it.
seed = 4
targetFloor = 8
# The tutorial's own stage, outside the race catalog (content/stages/dawn.toml).
stageId = "dawn"
# The tutorial's own song, outside the race catalog (content/songs/dawn-tutorial.toml).
songId = "dawn-tutorial"

[[steps]]
kind = "move"
prompt.keyboard = "Steer left, then right, with A and D or the arrow keys."
prompt.gamepad = "Steer left, then right, with {glyph}."
prompt.touch = "Drag left, then right, in the lower half to steer."
prompt.buttons = "Hold the left arrow, then the right, to steer."

[[steps]]
kind = "land"
prompt.keyboard = "You bounce on your own. Follow the dots onto the next floor. Press into a side for a boost; land on top for floor credit."
prompt.gamepad = "You bounce on your own. Follow the dots onto the next floor. Press into a side for a boost; land on top for floor credit."
prompt.touch = "You bounce on your own. Follow the dots onto the next floor. Press into a side for a boost; land on top for floor credit."


[[steps]]
kind = "fastFall"
prompt.keyboard = "In the air, hold S or the down arrow to fast fall."
prompt.gamepad = "In the air, press {glyph} or push down to fast fall."
prompt.touch = "In the air, flick down anywhere to fast fall."
prompt.buttons = "In the air, hold the down arrow to fast fall."

[[steps]]
kind = "landMoving"
prompt.keyboard = "Land on a moving floor. Time your steer."
prompt.gamepad = "Land on a moving floor. Time your steer."
prompt.touch = "Land on a moving floor. Time your drag."
prompt.buttons = "Land on a moving floor. Time your steer."

[[steps]]
kind = "survive"
prompt.keyboard = "Stay above the lava."
prompt.gamepad = "Stay above the lava."
prompt.touch = "Stay above the lava."
