stageId = "sunken-dome"
songId = "farther-from-home"
seed = 8
floorOffset = 21
parSeconds = 120
before = "the-deep"
startFloor = 0
teaches = []

[[chapters.actors]]
id = "frog"
ceiling = 9
leash = true

[[chapters.actors]]
id = "oni"
ceiling = 10
leash = true
floor = 3
ahead = 2

[[chapters.glims]]
floor = 4
offset = 90

[[chapters.glims]]
floor = 6
offset = -90

[[chapters.glims]]
floor = 8
offset = 100

[[chapters.glims]]
floor = 7
offset = -120

[[chapters.glims]]
floor = 5
offset = 120

[[chapters.glims]]
floor = 3
offset = -110

[[chapters.phases]]
id = "climb"
goal = { kind = "reach", floor = 9 }

[[chapters.phases]]
id = "dive"
goal = { kind = "rescue", actor = "frog" }
lava = { under = "actor", startBelow = 170, rise = 8.0, grace = 0 }
safeSpots = [9]

[[chapters.phases]]
id = "back"
goal = { kind = "reach", floor = 9 }
lava = { under = "player", startBelow = 160, rise = 26.0, grace = 180 }
safeSpots = [2]

[[chapters.moments]]
when = { kind = "movingSeen" }
lines = [{ speaker = "frog", text = "These floors swim. Wait for one, then hop." }]

[[chapters.moments]]
when = { kind = "movingLanded" }
lines = [{ speaker = "you", text = "Got it!" }]

[[chapters.moments]]
when = { kind = "floor", floor = 8 }
lines = [{ speaker = "you", mood = "win", text = "I'm right behind Oni! I'm nearly first!" }]

[[chapters.moments]]
when = { kind = "phase", phase = "dive" }
do = [
  { do = "quake", strength = 1.0 },
  { do = "place", actor = "frog", floor = 2, parked = true },
  { do = "lookAt", actor = "frog", ticks = 150 },
  { do = "ceiling", actor = "oni", floor = 16 },
  { do = "leash", actor = "oni", on = false },
]
lines = [
  { speaker = "frog", mood = "lose", text = "Aaah! I'm okay! But my leg is stuck!" },
  { speaker = "oni", text = "Leave him. Don't look down." },
]

[[chapters.moments]]
when = { kind = "descended" }
lines = [{ speaker = "you", text = "Hold on, Frog! I'm coming down!" }]

[[chapters.moments]]
when = { kind = "rescue" }
do = [{ do = "unpark", actor = "frog" }]
lines = [{ speaker = "frog", mood = "win", text = "You came back!" }]

[[chapters.moments]]
when = { kind = "phase", phase = "back" }
lines = [{ speaker = "frog", text = "Lava! Climb! Climb!" }]

[[chapters.moments]]
when = { kind = "caught" }
lines = [{ text = "The lava got you. So what? Up again." }]

