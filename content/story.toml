# The story: "Don't Look Down" (design: the project's internal notes).
#
# Five chapters on stages and songs that already exist, each on a course of its
# own (`seed`, on base tuning) chosen so its lamps, safe spots and dive floors
# hold still (tests/client/features/story/seeds.test.ts). The words are the
# spec's script, line for line (tests/content/story-script.test.ts): a change to
# one is the owner's.
#
# A line's `speaker` is `you` (the player's own racer), an actor's id, or none
# for the narrator; `mood` picks the portrait (`win` or `lose`, plain without).
# A moment is something that happens in a climb: a few words, things done, or
# both. Nothing in a climb ever stops it.

# The prompts the control chip and the Instructions carousel name. Unchanged.
[prompts.move]
keyboard = "A D or ← → to steer"
gamepad = "{glyph} to steer"
touch = "Drag left or right"
buttons = "Hold an arrow to steer"

[prompts.fastFall]
keyboard = "S or ↓ to drop fast"
gamepad = "{glyph} to drop fast"
touch = "Flick down to drop fast"
buttons = "Hold the down arrow to drop fast"

# The two who climb with you. Each is a CPU racer with a story's own hands.
[actors.frog]
characterId = "frog"
colour = "cyan"
personality = { reactionTicks = 9, linedUpFraction = 0.7, slipChance = 0.12, slipTicks = 14, movingFloorPause = 20, stallTicks = 900, eagerDrop = 0.03, leadEase = 1, easeTicks = 70 }

[actors.oni]
characterId = "oni"
colour = "scarlet"
personality = { reactionTicks = 6, linedUpFraction = 0.9, slipChance = 0, slipTicks = 0, movingFloorPause = 0, stallTicks = 900, eagerDrop = 0, leadEase = 0, easeTicks = 0 }

# ---------------------------------------------------------------------------
# The cutscenes
# ---------------------------------------------------------------------------

[[cutscenes]]
id = "lowtown"
title = "Lowtown"
bed = "ambience.dawn"

[[cutscenes.panels]]
art = "story.lowtown"
move = { kind = "push", from = 1.0, to = 1.08 }
lines = [
  { text = "This is Lowtown. It sits at the bottom of a very tall tower." },
  { text = "One morning, the ground got warm." },
]

[[cutscenes.panels]]
art = "story.frogWarning"
move = { kind = "pan", from = 0.0, to = 1.0 }
lines = [
  { speaker = "frog", text = "Wake up! The lava is coming up!" },
  { speaker = "frog", text = "Everybody climbs today. All the way to Floor Fifty." },
]

[[cutscenes.panels]]
art = "story.oniAbove"
move = { kind = "pan", from = 1.0, to = 0.0 }
lines = [
  { speaker = "you", mood = "win", text = "Look! That's Oni. The best climber there is." },
  { speaker = "oni", text = "Rule one, little climber. Don't look down." },
  { speaker = "oni", text = "Rule two. Don't wait for anybody." },
  { speaker = "you", text = "I'm going to be first. Just like Oni." },
  { speaker = "frog", mood = "win", text = "First? I'll just be happy to get there!" },
]

[[cutscenes]]
id = "the-city"
title = "The City"
bed = "ambience.rooftop"

[[cutscenes.panels]]
art = "story.cityLamps"
move = { kind = "pan", from = 0.0, to = 1.0 }
lines = [
  { text = "Above Lowtown is the city. Nobody is home." },
  { speaker = "frog", text = "Look. Glims, stuck in the old lamps!" },
]

[[cutscenes.panels]]
art = "story.oniLeaps"
move = { kind = "push", from = 1.0, to = 1.1 }
lines = [
  { speaker = "oni", text = "Leave them. They will slow you down." },
  { speaker = "you", mood = "lose", text = "Oni did not even look." },
  { speaker = "frog", text = "Then we look. Drop on a lamp, hard. It pops right open!" },
]

[[cutscenes]]
id = "the-deep"
title = "The Deep"
bed = "ambience.sunkenDome"

[[cutscenes.panels]]
art = "story.theDeep"
move = { kind = "pan", from = 1.0, to = 0.0 }
lines = [
  { text = "Higher still, the tower is full of water. The floors drift about." },
  { speaker = "you", mood = "win", text = "I can see Oni! We are catching up!" },
  { speaker = "frog", text = "You go fast. I'll keep up. I always do." },
]

[[cutscenes]]
id = "together"
title = "Together"
bed = "ambience.snowShrine"

[[cutscenes.panels]]
art = "story.theHand"
move = { kind = "push", from = 1.0, to = 1.08 }
lines = [
  { text = "You were nearly first. Now you are near the bottom." },
  { speaker = "frog", text = "You gave up first place. For me?" },
  { speaker = "you", text = "Oni is wrong. I looked down, and I saw you." },
]

[[cutscenes.panels]]
art = "story.lookingUp"
move = { kind = "pan", from = 1.0, to = 0.0 }
lines = [
  { speaker = "frog", text = "The lava is right behind us. Ready?" },
  { speaker = "you", mood = "win", text = "Ready. Together this time." },
]

[[cutscenes]]
id = "the-ledge"
title = "The Ledge"
bed = "ambience.dawn"

[[cutscenes.panels]]
art = "story.theLedge"
move = { kind = "push", from = 1.0, to = 1.08 }
lines = [
  { text = "Almost at Floor Fifty. Then you hear a shout. From below." },
  { speaker = "oni", mood = "lose", text = "My ledge broke. I never saw it. I never look down." },
]

[[cutscenes.panels]]
art = "story.oniAfraid"
move = { kind = "push", from = 1.0, to = 1.06 }
lines = [
  { speaker = "oni", mood = "lose", text = "Go on. Be first. That is the rule." },
  { speaker = "you", text = "I have a better rule." },
  { speaker = "frog", mood = "win", text = "Here we go again! Wheee!" },
]

[[cutscenes]]
id = "the-top"
title = "The Top"
bed = "music.tutorial"

[[cutscenes.panels]]
art = "story.floorFifty"
move = { kind = "push", from = 1.0, to = 1.06 }
lines = [
  { text = "Floor Fifty. The top of the tower. The lava cannot reach." },
  { speaker = "frog", mood = "win", text = "We made it! Who was first?" },
  { speaker = "you", text = "I don't know. I was not looking up." },
]

# The glims you carried rise here (the screen draws them).
[[cutscenes.panels]]
art = "story.lookingDown"
move = { kind = "pan", from = 1.0, to = 0.0 }
glims = true
lines = [
  { text = "You let the glims go. One by one, they lit up the morning." },
  { speaker = "oni", text = "I never looked down. I never knew it looked like this." },
]

[[cutscenes.panels]]
art = "story.oniReaches"
move = { kind = "push", from = 1.0, to = 1.06 }
lines = [
  { text = "More climbers were still coming. Oni was the first to reach down." },
  { speaker = "oni", mood = "win", text = "Rule one, little climber. Look down." },
]

[ending]
cutscene = "the-top"
thesis = [
  "The best climbers look down.",
  "That is how they see who needs a hand.",
]
last = { speaker = "frog", mood = "win", text = "Now let's race! First one up waits for the others." }

# ---------------------------------------------------------------------------
# Chapter 1: Lowtown. Teaches steer and land. Frog climbs beside you; then
# the quake, and the first of the lava, slow, behind you to floor 9.
# ---------------------------------------------------------------------------

[[chapters]]
id = "lowtown"
title = "Lowtown"
stageId = "dawn"
songId = "dawn-tutorial"
seed = 862
floorOffset = 0
parSeconds = 60
before = "lowtown"
startFloor = 0
teaches = ["move"]

[[chapters.actors]]
id = "frog"
ceiling = 9
leash = true

[[chapters.glims]]
floor = 1
offset = -90

[[chapters.glims]]
floor = 2
offset = 80

[[chapters.glims]]
floor = 3
offset = -70

[[chapters.glims]]
floor = 4
offset = 100

[[chapters.glims]]
floor = 5
offset = -100

[[chapters.phases]]
id = "climb"
goal = { kind = "reach", floor = 6 }

# The ground shakes, and the lava shows itself for the first time: slow, so a
# new player learns it rises and that it only means "keep climbing".
[[chapters.phases]]
id = "run"
goal = { kind = "reach", floor = 9 }
lava = { under = "player", startBelow = 160, rise = 14.0, grace = 90 }
safeSpots = [6]

[[chapters.moments]]
when = { kind = "start" }
lines = [{ speaker = "frog", text = "Up we go! Follow me!" }]

[[chapters.moments]]
when = { kind = "landed" }
lines = [{ speaker = "frog", text = "See? Your legs bounce all by themselves." }]

[[chapters.moments]]
when = { kind = "glimSeen" }
lines = [{ speaker = "frog", text = "A glim! It's too little to climb. Grab it!" }]

[[chapters.moments]]
when = { kind = "glimFirst" }
lines = [{ speaker = "you", text = "Got you. Hold on tight." }]

[[chapters.moments]]
when = { kind = "floor", floor = 4 }
do = [{ do = "drop", actor = "frog", floors = 1 }]
lines = [{ speaker = "frog", mood = "win", text = "Whoops! Ha ha! I fall all day." }]

[[chapters.moments]]
when = { kind = "phase", phase = "run" }
do = [{ do = "quake", strength = 0.8 }]
lines = [{ speaker = "you", mood = "lose", text = "The ground is shaking!" }]

# ---------------------------------------------------------------------------
# Chapter 2: The City. Teaches fast fall. Lamps open only under a hard landing.
# ---------------------------------------------------------------------------

[[chapters]]
id = "city"
title = "The City"
stageId = "rooftops"
songId = "moving-on"
seed = 139
floorOffset = 9
parSeconds = 80
before = "the-city"
startFloor = 0
teaches = ["fastFall"]
lamps = [3, 6, 9]

[[chapters.actors]]
id = "frog"
ceiling = 12
leash = true

[[chapters.actors]]
id = "oni"
ceiling = 16
leash = false

[[chapters.phases]]
id = "climb"
goal = { kind = "reach", floor = 12, lamps = 3 }

[[chapters.moments]]
when = { kind = "start" }
lines = [{ speaker = "oni", text = "Too slow. Don't look down!" }]

[[chapters.moments]]
when = { kind = "lampSeen" }
lines = [{ speaker = "frog", text = "Watch me! Wheee!" }]

[[chapters.moments]]
when = { kind = "lampSoft" }
lines = [{ speaker = "frog", text = "Harder! Drop fast onto it." }]

[[chapters.moments]]
when = { kind = "lampOpen" }
lines = [{ speaker = "you", mood = "win", text = "I fell on purpose. And it worked!" }]

[[chapters.moments]]
when = { kind = "needLamp" }
lines = [{ speaker = "frog", text = "Wait! Pop a lamp first. Drop on it, hard." }]

[[chapters.moments]]
when = { kind = "goal" }
lines = [{ speaker = "frog", text = "Falling is not losing. Down is just the way to the next up." }]

