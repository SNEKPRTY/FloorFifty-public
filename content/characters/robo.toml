# Cosmetic only. A character is a body; the seat keeps its colour, so each seat
# colour has its own recoloured sheet and portrait. Nothing here reaches a race.
id = "robo"
displayName = "Robo"
unlock = "games-7"

[sheetAliases]
scarlet = "robo.scarlet"
cyan = "robo.cyan"
gold = "robo.gold"
violet = "robo.violet"

# The neutral bust per seat; the win and lose moods are the same alias with
# `Win` and `Lose` appended.
[portraitAliases]
scarlet = "portrait.roboScarlet"
cyan = "portrait.roboCyan"
gold = "portrait.roboGold"
violet = "portrait.roboViolet"
